<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Ashley 💕</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink-soft: #f8e1e8;
        --pink-medium: #e8a0b4;
        --pink-dark: #c4647a;
        --pink-accent: #d4758a;
        --text-dark: #5a4a4e;
        --text-light: #7a6a6e;
        --white: #fff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Quicksand", sans-serif;
        background: var(--pink-soft);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      .heart {
        position: fixed;
        pointer-events: none;
        z-index: 1;
        opacity: 0;
        animation: drift linear infinite;
      }

      @keyframes drift {
        0% {
          top: -5%;
          opacity: 0.6;
          transform: translateX(0) rotate(0deg);
        }
        100% {
          top: 105%;
          opacity: 0;
          transform: translateX(20px) rotate(15deg);
        }
      }

      .card {
        background: var(--white);
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 420px;
        width: 92%;
        text-align: center;
        box-shadow: 0 4px 24px rgba(196, 100, 122, 0.12);
        position: relative;
        z-index: 10;
      }

      .page {
        display: none;
      }

      .page.active {
        display: block;
        animation: enter 0.4s ease-out;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        font-size: 2.5rem;
        margin-bottom: 16px;
      }

      .icon-heart {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      h1 {
        color: var(--pink-dark);
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .highlight {
        color: var(--pink-accent);
      }

      .text {
        color: var(--text-light);
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 16px 0 24px;
        font-weight: 500;
      }

      .reasons {
        text-align: left;
        margin: 24px 0;
      }

      .reason {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        color: var(--text-dark);
        font-size: 0.95rem;
        line-height: 1.5;
        border-bottom: 1px solid var(--pink-soft);
      }

      .reason:last-child {
        border-bottom: none;
      }

      .reason-icon {
        color: var(--pink-medium);
        flex-shrink: 0;
        margin-top: 2px;
      }

      .gif {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 12px;
        margin: 0 auto 20px;
        display: block;
      }

      .question {
        font-size: 1.5rem;
        color: var(--pink-dark);
        font-weight: 700;
        margin: 16px 0 24px;
      }

      .btn {
        background: var(--pink-medium);
        color: var(--white);
        border: none;
        padding: 12px 32px;
        font-size: 0.95rem;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        transition:
          background 0.2s,
          transform 0.2s;
      }

      .btn:hover {
        background: var(--pink-dark);
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        min-height: 120px;
        flex-wrap: wrap;
      }

      .btn-yes {
        background: #7cb58a;
        transition: all 0.25s ease;
      }

      .btn-yes:hover {
        background: #5fa36d;
      }

      .btn-no {
        background: #bbb;
        font-size: 0.85rem;
        padding: 10px 24px;
        transition: all 0.15s ease;
      }

      .btn-no:hover {
        background: #aaa;
      }

      .celebration .gif {
        width: 200px;
        height: 200px;
      }

      .celebration-emoji {
        font-size: 2rem;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="page active" id="page0">
        <div class="icon">💌</div>
        <h1>Hey <span class="highlight">Ashley</span></h1>
        <p class="text">I have something I want to ask you...</p>
        <button class="btn" onclick="nextPage(1)">Open</button>
      </div>

      <div class="page" id="page1">
        <div class="icon icon-heart">💕</div>
        <h1>A few reasons why</h1>
        <div class="reasons">
          <div class="reason">
            <span class="reason-icon">💔</span>
            <span>You haven't run away from my weird sense of humor yet</span>
          </div>
          <div class="reason">
            <span class="reason-icon">😭</span>
            <span>These past few weeks have been my favorite</span>
          </div>
          <div class="reason">
            <span class="reason-icon">🤩</span>
            <span>I want to keep making memories with you</span>
          </div>
        </div>
        <button class="btn" onclick="nextPage(2)">Continue</button>
      </div>

      <div class="page" id="page2">
        <img src="./images/image1.gif" alt="" class="gif" id="questionGif" />
        <h1 class="highlight">Ashley</h1>
        <p class="question">Will you be my Valentine?</p>
        <div class="buttons" id="buttonContainer">
          <button class="btn btn-yes" id="yesButton" onclick="celebrate()">
            Yes!
          </button>
          <button class="btn btn-no" id="noButton">No</button>
        </div>
      </div>

      <div class="page celebration" id="page3">
        <img src="./images/image7.gif" alt="" class="gif" />
        <h1>Yay!!! 🎉</h1>
        <p class="text">You just made me so happy!</p>
        <div class="celebration-emoji">🙃</div>
      </div>
    </div>

    <script>
      const noResponses = [
        "No",
        "Are you sure?",
        "Pookie please",
        "Don't do this :(",
        "You're breaking my heart",
        "I'm gonna cry...",
      ];

      const imagePaths = [
        "./images/image1.gif",
        "./images/image2.gif",
        "./images/image3.gif",
        "./images/image4.gif",
        "./images/image5.gif",
        "./images/image6.gif",
      ];

      let noClickCount = 0;
      let yesScale = 1;
      let noScale = 1;

      const noButton = document.getElementById("noButton");
      const yesButton = document.getElementById("yesButton");
      const buttonContainer = document.getElementById("buttonContainer");
      const questionGif = document.getElementById("questionGif");

      // No button runs away on hover
      noButton.addEventListener("mouseenter", moveNoButton);
      noButton.addEventListener("touchstart", moveNoButton);

      function moveNoButton() {
        // Random offset from its natural position
        const maxX = 80;
        const maxY = 50;

        const randomX = (Math.random() - 0.5) * 2 * maxX;
        const randomY = (Math.random() - 0.5) * 2 * maxY;

        noButton.style.transform = `translate(${randomX}px, ${randomY}px) scale(${noScale})`;

        // Shrink no button and grow yes button each hover
        noScale = Math.max(0.5, noScale - 0.05);
        yesScale += 0.08;

        yesButton.style.transform = `scale(${yesScale})`;
        noButton.style.fontSize = `${Math.max(0.7, 0.85 - noClickCount * 0.03)}rem`;
      }

      noButton.addEventListener("click", function () {
        if (noClickCount < 5) {
          noClickCount++;
          questionGif.src = imagePaths[noClickCount];
          noButton.textContent = noResponses[noClickCount];
          moveNoButton();
        }
      });

      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = ["♡", "❤", "💕"][Math.floor(Math.random() * 3)];
        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration = Math.random() * 4 + 5 + "s";
        heart.style.fontSize = Math.random() * 12 + 14 + "px";
        heart.style.color = `hsl(${340 + Math.random() * 20}, ${60 + Math.random() * 20}%, ${70 + Math.random() * 15}%)`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 9000);
      }

      setInterval(createHeart, 600);
      for (let i = 0; i < 8; i++) setTimeout(createHeart, i * 200);

      function nextPage(num) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("page" + num).classList.add("active");
      }

      function celebrate() {
        nextPage(3);

        const end = Date.now() + 3500;
        const colors = ["#e8a0b4", "#c4647a", "#f8e1e8", "#d4758a"];

        (function frame() {
          confetti({
            particleCount: 3,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: colors,
          });
          confetti({
            particleCount: 3,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: colors,
          });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();

        for (let i = 0; i < 25; i++) setTimeout(createHeart, i * 100);
      }
    </script>
  </body>
</html>
